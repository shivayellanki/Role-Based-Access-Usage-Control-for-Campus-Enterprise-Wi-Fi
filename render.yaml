services:
  - type: web
    name: rb-wifi-backend
    runtime: node
    rootDir: .
    buildCommand: "npm install && cd frontend && npm install && npm run build && cd ../backend && npm install"
    startCommand: "cd backend && node server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: rb-wifi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: rb-wifi-backend
          property: host
          envVarKey: RENDER_EXTERNAL_URL
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: rb-wifi-db
    databaseName: rbwifi
    user: rbwifi_user
    plan: free
